name: daily

on:
  schedule:
    # Pickers leave before dawn, so the forecast has to be on the server by 04:00 Croatian
    # time. Two things fight that. Nothing new is computable at 02z (DWD finishes ICON-EU
    # 00z around 03z, ECMWF open data reaches +192 h around 07z), so an early run has to
    # use the previous 12z runs. And GitHub starts scheduled workflows when it feels like
    # it - this one has been landing five to six hours late every day.
    #
    # Hence three runs, all UTC, each one publishing the Croatian date it wakes up in:
    #   19:50  on time it publishes today late in the evening; five hours late it becomes
    #          tomorrow's forecast, on the server around 03:00 Croatian time
    #   01:50  the same job for whenever GitHub is punctual
    #   07:40  today's ICON-EU 00z and the IMERG for yesterday are out, so this run is
    #          twelve hours fresher and replaces the earlier ones for late risers
    - cron: "50 19 * * *"
    - cron: "50 1 * * *"
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (empty = today UTC)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y -qq lftp

      - name: Restore ERA5-Land cache
        uses: actions/cache@v4
        with:
          path: |
            cache/era5land_*.nc
            cache/era5_*.nc
          key: era5land-${{ github.run_id }}
          restore-keys: era5land-

      - name: Credentials
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          umask 077
          # The 60-day token is only a stopgap until EARTHDATA_PASSWORD is set.
          if [ -z "$EARTHDATA_PASSWORD" ] && [ -n "$EARTHDATA_TOKEN" ]; then
            printf '%s' "$EARTHDATA_TOKEN" > ~/.gljivar_edl_token
          fi
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "$CDSAPI_KEY" > ~/.cdsapirc
          printf 'machine urs.earthdata.nasa.gov login %s password %s\nmachine ftp.designer2.org login %s password %s\n' \
            "$EARTHDATA_USERNAME" "$EARTHDATA_PASSWORD" "$FTP_USER" "$FTP_PASS" > ~/.netrc

      - name: Check Earthdata login
        # Fails only on a rejected login (expired token / changed password). A GES DISC
        # outage just prints a warning - the run then uses ECMWF/ICON rain for the gap.
        run: python -c "import imerg; imerg.check_login()"

      - name: Compute
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily.py ${{ inputs.date }}

      - name: Preview
        run: python preview.py

      - name: Publish
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: ./publish.sh

      # v2 (nine countries + rain layer, data/v2/ for the 0.5.0 apps) runs after v1 is
      # published and may fail on its own: the 0.4.x apps must never lose their data to it.
      # It reuses the ICON-EU / ECMWF files the v1 run left in cache/.
      - name: Compute v2
        id: v2
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily.py --v2 ${{ inputs.date }}

      - name: Publish v2
        id: v2pub
        if: steps.v2.outcome == 'success'
        continue-on-error: true
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python preview.py --v2 --map vrganj
          python preview.py --v2 --rain 7
          ./publish.sh v2

      - name: Keep archive
        run: |
          git config user.name "gljivar-bot"
          git config user.email "gljivar-bot@users.noreply.github.com"
          # (git add <dir> also stages deletions: v2 prunes its archive to 75 days)
          git add archive out/latest.json out/grid.json
          if [ -f out/v2/latest.json ]; then git add out/v2/latest.json out/v2/grid.json; fi
          git diff --cached --quiet || git commit -q -m "data $(python3 -c "import json;print(json.load(open('out/latest.json'))['date'])")"
          # The data is already published at this point, so a moved main must not fail the job.
          git push -q || { git pull --rebase -q && git push -q; }

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            out/preview-*.png
            out/v2/preview-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Telegram on v2 failure
        if: steps.v2.outcome == 'failure' || steps.v2pub.outcome == 'failure'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify.py "Gljivar: v2 (9 zemalja, data/v2) NIJE objavljen ($(date -u +%F)); v1 je objavljen. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify.py "Gljivar: dnevni izračun NIJE uspio ($(date -u +%F)). ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
